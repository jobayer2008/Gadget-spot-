<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gadget Spot</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f8fafc;--sf:#fff;--sv:#f1f5f9;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--pr:#0284c7;--prd:#0369a1;--gold:#f59e0b;--ok:#10b981;--err:#ef4444;--bk:#d8226b;--ng:#f7921e}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--sf:#131c2e;--sv:#1e293b;--tx:#e8eef7;--mut:#94a3b8;--bd:#334155;--pr:#38bdf8;--prd:#0284c7}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'Hind Siliguri',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;gap:14px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;color:var(--pr)}
header input{flex:1;min-width:180px}
nav{display:flex;gap:14px;font-weight:500}nav a:hover{color:var(--pr)}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0))}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--sv);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:auto}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mut)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--pr);color:#fff}
button.g{background:var(--sv);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--err)}button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1,h2{margin:6px 0 12px}h2{font-size:19px}h3{font-size:14px;margin:8px 0 4px;font-weight:600}
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:16px}
.bn{flex:0 0 min(100%,640px);scroll-snap-align:start;position:relative;border-radius:16px;overflow:hidden;min-height:170px;background:var(--sv)}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn div{position:relative;padding:22px;color:#fff;background:linear-gradient(90deg,rgba(0,0,0,.7),transparent);min-height:170px}
.bn b{background:var(--gold);color:#000;border-radius:6px;padding:1px 8px;font-size:12px}.bn h2{margin:8px 0 2px;font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:99px;background:var(--sv);border:1px solid var(--bd);font-weight:500;color:var(--tx)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px;display:block}
.card:hover{border-color:var(--pr)}
.im{position:relative;aspect-ratio:1;background:var(--sv);border-radius:10px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.off,.oos{position:absolute;top:6px;left:6px;background:var(--err);color:#fff;border-radius:6px;font-size:11px;padding:0 6px}.oos{left:auto;right:6px;background:#334155}
.pr{font-weight:700;color:var(--pr)}.pr s{color:var(--mut);font-weight:400;font-size:12px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:720px){.det{grid-template-columns:1fr}}
.main-im{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sv)}.main-im img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.thumbs img.on{border-color:var(--pr)}
.opt{display:inline-block;padding:5px 14px;border:1px solid var(--bd);border-radius:99px;margin:0 6px 6px 0;cursor:pointer;background:var(--sv)}.opt.on{border-color:var(--pr);background:var(--pr);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.ci img{width:64px;height:64px;object-fit:cover;border-radius:8px}.ci>div{flex:1}
.q{display:inline-flex;align-items:center;gap:8px}.q button{padding:2px 11px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.b{font-weight:700;font-size:17px;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.pm{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:600;color:var(--tx);font-size:15px;margin-top:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:0 0 auto;background:var(--sv);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.empty{text-align:center;padding:50px 16px;color:var(--mut)}
.steps{display:flex;gap:4px;margin:14px 0}.steps div{flex:1;text-align:center;font-size:12px;padding-top:8px;border-top:4px solid var(--bd);color:var(--mut)}.steps div.on{border-color:var(--ok);color:var(--ok);font-weight:600}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;background:var(--sv)}
pre{background:var(--sv);border:1px solid var(--bd);border-radius:10px;padding:12px;overflow:auto;max-height:420px;font-size:12px;white-space:pre}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.sm{font-size:12px;color:var(--mut)}.x{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="hd"></div>
<main id="app"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=n=>'৳'+Number(n||0).toLocaleString('en-IN');
const LS=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
/* === এখানে আপনার Supabase তথ্য বসান (Publishable key বসানো নিরাপদ) === */
const SUPABASE_URL='',SUPABASE_KEY='';
let me=null,accMode='in',sb=null,cfg=(SUPABASE_URL&&SUPABASE_KEY)?{url:SUPABASE_URL,key:SUPABASE_KEY}:LS('gs_cfg'),P=[],B=[],SH=[],PAY=null,loadErr='',cart=LS('gs_cart')||[],admin=false,tab='orders',cat='সব',q='',dImg=0,dCol='',dQty=1,editId=null,AO=[],AB=[];
const STAT=['Pending','Confirmed','Processing','Shipped','Delivered'],STB={Pending:'অর্ডার গৃহীত',Confirmed:'কনফার্মড',Processing:'প্রসেসিং',Shipped:'শিপড',Delivered:'ডেলিভারড',Cancelled:'বাতিল'};
const PST=['Pending Verification','Verified','Rejected','Paid'];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
const saveCart=()=>{LS('gs_cart',cart);hdr()};
async function loadAll(){
  if(!sb)return;loadErr='';
  const r=await Promise.all([sb.from('products').select('*').order('created_at',{ascending:false}),sb.from('banners').select('*').eq('is_active',true).order('sort_order'),sb.from('division_shipping').select('*').order('division'),sb.from('payment_settings').select('*').eq('id',1).maybeSingle()]);
  const e=r.find(x=>x.error);if(e)loadErr=e.error.message;
  P=r[0].data||[];B=r[1].data||[];SH=r[2].data||[];PAY=r[3].data;
}
function hdr(){
  $('#hd').innerHTML=`<header><a href="#/" class="logo">Gadget Spot</a><input id="srch" aria-label="সার্চ" placeholder="গ্যাজেট, ব্র্যান্ড বা মডেল খুঁজুন..." value="${esc(q)}" oninput="q=this.value;if(location.hash.length>2)location.hash='#/';drawGrid()"><nav><a href="#/track">অর্ডার ট্র্যাক</a><a href="#/cart">কার্ট${cart.length?' ('+cart.reduce((s,i)=>s+i.qty,0)+')':''}</a>${admin?'<a href="#/admin">এডমিন প্যানেল</a>':''}<a href="#/${me?'account':'login'}">${me?'অ্যাকাউন্ট':'লগইন'}</a></nav></header>`;
  const s=$('#srch');if(s&&document.activeElement&&document.activeElement.id==='srch'){}
}
const empty=(a,b)=>`<div class="empty"><h2>${a}</h2><p>${b||''}</p></div>`;
const noDb=()=>empty('ডাটাবেজ কানেক্ট করা হয়নি','<a class="chip on" href="#/login">লগইন করে কানেক্ট করুন (এডমিন)</a>');

async function route(){
  hdr();const [,r,id]=(location.hash.slice(1)||'/').split('/');scrollTo(0,0);
  if(r==='login')return me?(location.hash=admin?'#/admin':'#/account'):loginView();
  if(r==='admin')return adminView();
  if(r==='track')return trackView();
  if(!sb)return app.innerHTML=noDb();
  if(loadErr)return app.innerHTML=empty('ডাটা লোড করা যায়নি',esc(loadErr)+'<br>এডমিন ট্যাবের SQL চালানো হয়েছে কিনা দেখুন।');
  if(r==='account')return accountView();
  if(r==='p')return detail(id);
  if(r==='cart')return cartView();
  if(r==='checkout')return checkout();
  if(r==='done')return app.innerHTML=`<div class="box empty"><h2>অর্ডার সম্পন্ন হয়েছে ✓</h2><p>আপনার অর্ডার নম্বর: <b style="color:var(--pr);font-size:20px">${esc(id)}</b><br>ট্র্যাক করতে এই নম্বর ও মোবাইল নম্বর সংরক্ষণ করুন।</p><a class="chip on" href="#/track">অর্ডার ট্র্যাক করুন</a></div>`;
  home();
}
/* ---------- Storefront ---------- */
function home(){
  if(!P.length&&!B.length)return app.innerHTML=empty('এখনো কোনো পণ্য নেই','এডমিন প্যানেল থেকে পণ্য আপলোড করলে এখানে দেখা যাবে।');
  const cats=['সব',...new Set(P.map(p=>p.category))];
  app.innerHTML=(B.length?`<div class="banners">${B.map(b=>`<a class="bn" href="${b.target_category?'#/':'#/'}" onclick="${b.target_category?`cat='${esc(b.target_category).replace(/'/g,'')}';`:''}setTimeout(route,0)"><img src="${esc(b.image_url)}" alt=""><div><b>${esc(b.tag)}</b><h2>${esc(b.title)}</h2><span>${esc(b.subtitle)}</span></div></a>`).join('')}</div>`:'')+
  `<div class="chips" id="chips"></div><div class="grid" id="grid"></div>`;
  drawGrid();
}
function drawGrid(){
  const g=$('#grid');if(!g)return;
  const cats=['সব',...new Set(P.map(p=>p.category))];
  $('#chips').innerHTML=cats.map(c=>`<a class="chip ${c===cat?'on':''}" href="javascript:void 0" onclick="cat=this.dataset.c;drawGrid()" data-c="${esc(c)}">${esc(c)}</a>`).join('');
  const t=q.trim().toLowerCase(),l=P.filter(p=>(cat==='সব'||p.category===cat)&&(!t||(p.name+' '+p.category+' '+p.description).toLowerCase().includes(t)));
  g.innerHTML=l.length?l.map(card).join(''):'<div class="empty" style="grid-column:1/-1">কোনো পণ্য পাওয়া যায়নি</div>';
}
const card=p=>{const off=p.original_price>p.price?Math.round((1-p.price/p.original_price)*100):0;return`<a class="card" href="#/p/${p.id}"><div class="im"><img loading="lazy" src="${esc((p.images||[])[0]||'')}" alt="">${off?`<span class="off">-${off}%</span>`:''}${p.stock<1?'<span class="oos">স্টক আউট</span>':''}</div><h3>${esc(p.name)}</h3><div class="pr">${tk(p.price)} ${off?`<s>${tk(p.original_price)}</s>`:''}</div></a>`};
function detail(id,keep){
  const p=P.find(x=>x.id===id);if(!p)return app.innerHTML=empty('পণ্য পাওয়া যায়নি');
  if(!keep){dImg=0;dQty=1;dCol=(p.colors||[])[0]||''}
  const im=p.images||[],sp=Object.entries(p.specs||{});
  app.innerHTML=`<div class="det"><div><div class="main-im"><img src="${esc(im[dImg]||'')}" alt=""></div><div class="thumbs">${im.map((u,i)=>`<img class="${i===dImg?'on':''}" src="${esc(u)}" alt="" onclick="dImg=${i};detail('${p.id}',1)">`).join('')}</div></div>
  <div><h1>${esc(p.name)}</h1><div class="pr" style="font-size:24px">${tk(p.price)} ${p.original_price>p.price?`<s>${tk(p.original_price)}</s>`:''}</div>
  <p class="sm">ক্যাটাগরি: ${esc(p.category)} · ${p.stock>0?`স্টকে আছে (${p.stock})`:'<b style="color:var(--err)">স্টক আউট</b>'}</p>
  ${(p.colors||[]).length?`<label>কালার</label>${p.colors.map(c=>`<span class="opt ${c===dCol?'on':''}" onclick="dCol=this.dataset.c;detail('${p.id}',1)" data-c="${esc(c)}">${esc(c)}</span>`).join('')}`:''}
  <label>পরিমাণ</label><div class="q"><button class="g" onclick="dQty=Math.max(1,dQty-1);detail('${p.id}',1)">−</button><b>${dQty}</b><button class="g" onclick="dQty=Math.min(${p.stock},dQty+1);detail('${p.id}',1)">+</button></div>
  <div class="row" style="margin-top:16px"><button class="g" ${p.stock<1?'disabled':''} onclick="addCart('${p.id}')">কার্টে যোগ করুন</button><button ${p.stock<1?'disabled':''} onclick="addCart('${p.id}',1)">এখনই কিনুন</button></div>
  <p style="white-space:pre-line">${esc(p.description)}</p>
  ${sp.length?`<table>${sp.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>`:''}</div></div>`;
}
function addCart(id,go){
  const p=P.find(x=>x.id===id),it=cart.find(i=>i.id===id&&i.color===dCol);
  if(it)it.qty=Math.min(p.stock,it.qty+dQty);else cart.push({id,color:dCol,qty:dQty});
  saveCart();if(go)location.hash='#/checkout';else toast('কার্টে যোগ হয়েছে')
}
const cItems=()=>{cart=cart.filter(i=>P.some(p=>p.id===i.id));return cart.map(i=>({i,p:P.find(p=>p.id===i.id)}))};
const cSub=()=>cItems().reduce((s,{i,p})=>s+i.qty*p.price,0);
function cartView(){
  const l=cItems();if(!l.length)return app.innerHTML=empty('কার্ট খালি','<a class="chip on" href="#/">শপিং শুরু করুন</a>');
  app.innerHTML=`<h1>আমার কার্ট</h1><div class="box">${l.map(({i,p},n)=>`<div class="ci"><img src="${esc((p.images||[])[0]||'')}" alt=""><div><b>${esc(p.name)}</b><div class="sm">${esc(i.color)}</div><div class="pr">${tk(p.price)}</div></div><div class="q"><button class="g" onclick="cq(${n},-1)">−</button><b>${i.qty}</b><button class="g" onclick="cq(${n},1)">+</button></div><button class="g d" style="color:#fff" onclick="cart.splice(${n},1);saveCart();cartView()" aria-label="মুছুন">✕</button></div>`).join('')}
  <div class="tot b"><span>সাবটোটাল</span><span>${tk(cSub())}</span></div></div><a href="#/checkout"><button style="width:100%">চেকআউট করুন</button></a>`;
}
function cq(n,d){const{p}=cItems()[n];cart[n].qty=Math.max(1,Math.min(p.stock,cart[n].qty+d));saveCart();cartView()}
function checkout(){
  const l=cItems();if(!l.length)return location.hash='#/cart';
  if(!SH.length)return app.innerHTML=empty('ডেলিভারি এরিয়া সেট করা হয়নি','এডমিন প্যানেল থেকে ডেলিভারি চার্জ যোগ করুন।');
  const pm=[];if(PAY?.bkash_number)pm.push(['bKash','বিকাশ','var(--bk)']);if(PAY?.nagad_number)pm.push(['Nagad','নগদ','var(--ng)']);if(!PAY||PAY.cod_enabled)pm.push(['Cash on Delivery','ক্যাশ অন ডেলিভারি','var(--ok)']);
  app.innerHTML=`<h1>চেকআউট</h1><div class="det"><div class="box"><h2>ডেলিভারি তথ্য</h2>
  <label>পূর্ণ নাম</label><input id="f_name" value="${esc(me?.user_metadata?.name)}"><label>মোবাইল নম্বর</label><input id="f_phone" inputmode="tel" placeholder="01XXXXXXXXX" value="${esc(me?.user_metadata?.phone)}"><label>ঠিকানা</label><textarea id="f_addr" rows="2"></textarea>
  <div class="row"><div><label>বিভাগ</label><select id="f_div" onchange="fillDist()">${SH.map(s=>`<option>${esc(s.division)}</option>`).join('')}</select></div><div><label>জেলা</label><select id="f_dist"></select></div></div></div>
  <div><div class="box"><h2>পেমেন্ট</h2>${pm.map(([v,t,c],n)=>`<label class="pm"><input type="radio" name="pm" value="${v}" ${n?'':'checked'} onchange="payBox()"><span style="color:${c}">●</span> ${t}</label>`).join('')}<div id="payBox"></div></div>
  <div class="box"><div id="sum"></div><button style="width:100%;margin-top:10px" id="po" onclick="placeOrder()">অর্ডার কনফার্ম করুন</button></div></div></div>`;
  fillDist();payBox();
}
const curShip=()=>SH.find(s=>s.division===$('#f_div').value)||SH[0];
function fillDist(){const s=curShip();$('#f_dist').innerHTML=(s.districts||[]).map(d=>`<option>${esc(d)}</option>`).join('');sum();payBox()}
function sum(){const s=curShip(),sub=cSub();$('#sum').innerHTML=`<div class="tot"><span>সাবটোটাল</span><span>${tk(sub)}</span></div><div class="tot"><span>ডেলিভারি (${esc(s.estimated_days)})</span><span>${tk(s.delivery_fee)}</span></div><div class="tot b"><span>সর্বমোট</span><span>${tk(sub+ +s.delivery_fee)}</span></div>`}
function payBox(){
  const m=document.querySelector('input[name=pm]:checked')?.value,b=$('#payBox');if(!b)return;sum();
  if(m==='bKash'||m==='Nagad'){const n=m==='bKash'?PAY.bkash_number:PAY.nagad_number,t=m==='bKash'?PAY.bkash_type:PAY.nagad_type;
    b.innerHTML=`<p>${m} নম্বর: <b>${esc(n)}</b> <span class="tag">${esc(t)}</span> — এই নম্বরে ${tk(cSub()+ +curShip().delivery_fee)} পাঠিয়ে নিচের তথ্য দিন।</p><label>যে নম্বর থেকে পাঠিয়েছেন</label><input id="f_pp" inputmode="tel"><label>ট্রানজেকশন আইডি (TrxID)</label><input id="f_trx">`}
  else b.innerHTML=PAY?.advance_required&&PAY.advance_note&&!/ঢাকা|Dhaka/.test($('#f_div').value)?`<p class="sm">⚠ ${esc(PAY.advance_note)}</p>`:'';
}
async function placeOrder(){

  try{
    const c=sb&&cfg&&cfg.url===url&&cfg.key===key?sb:supabase.createClient(url,key);
    const r=up?await c.auth.signUp({email,password:pw,options:{data:{name:v('c_name'),phone:v('c_phone')}}}):await c.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    if(!r.data.session){toast('ইমেইলে পাঠানো লিংকে কনফার্ম করে তারপর লগইন করুন');$('#lb').disabled=false;return}
    cfg={url,key};LS('gs_cfg',cfg);sb=c;me=r.data.user;
    const{data:a}=await c.from('admins').select('user_id').eq('user_id',me.id).maybeSingle();admin=!!a;
    await loadAll();hdr();toast('লগইন সফল');
    const h=admin?'#/admin':'#/account';if(location.hash===h)route();else location.hash=h;
  }catch(e){toast('ব্যর্থ: '+e.message);const b=$('#lb');if(b)b.disabled=false}
}

/* ---------- Database SQL ---------- */
const SQL=`-- GADGET SPOT: Supabase (PostgreSQL) schema. Run once in SQL Editor.
create extension if not exists pgcrypto;

create table if not exists admins(user_id uuid primary key references auth.users(id) on delete cascade);
create or replace function is_admin() returns boolean language sql security definer stable set search_path=public as $$
  select exists(select 1 from admins where user_id=auth.uid()) $$;

create table if not exists products(
  id uuid primary key default gen_random_uuid(),
  name text not null, description text default '',
  price numeric(12,2) not null, original_price numeric(12,2) not null,
  category text not null, stock int not null default 0 check(stock>=0),
  images jsonb not null default '[]', colors jsonb not null default '[]', specs jsonb not null default '{}',
  is_featured boolean default false, created_at timestamptz default now());
create table if not exists banners(
  id uuid primary key default gen_random_uuid(),
  title text not null, subtitle text default '', tag text default '', image_url text not null,
  target_category text, is_active boolean default true, sort_order int default 0);
create table if not exists division_shipping(
  division text primary key, delivery_fee numeric(10,2) not null,
  estimated_days text not null, districts jsonb not null default '[]');
create table if not exists payment_settings(
  id int primary key default 1 check(id=1),
  bkash_number text default '', bkash_type text default 'Personal',
  nagad_number text default '', nagad_type text default 'Merchant',
  cod_enabled boolean default true, advance_required boolean default false,
  advance_note text default 'ঢাকার বাইরে ডেলিভারি চার্জ অগ্রিম প্রযোজ্য');
create table if not exists orders(
  id uuid primary key default gen_random_uuid(),
  order_no text unique not null,
  user_id uuid references auth.users(id) on delete set null,
  customer_name text not null, customer_phone text not null,
  address text not null, division text not null, district text not null,
  items jsonb not null, subtotal numeric(12,2) not null, delivery_fee numeric(10,2) not null, total numeric(12,2) not null,
  payment_method text not null check(payment_method in ('bKash','Nagad','Cash on Delivery')),
  payment_phone text default '', transaction_id text default '',
  payment_status text not null default 'Pending Verification',
  order_status text not null default 'Pending' check(order_status in ('Pending','Confirmed','Processing','Shipped','Delivered','Cancelled')),
  created_at timestamptz default now(), updated_at timestamptz default now());
create index if not exists idx_products_cat on products(category);
alter table orders add column if not exists user_id uuid references auth.users(id) on delete set null;
create index if not exists idx_orders_user on orders(user_id);
create index if not exists idx_orders_status on orders(order_status);
create index if not exists idx_orders_phone on orders(customer_phone);

-- Auto stock decrease on new order
create or replace function dec_stock() returns trigger language plpgsql security definer set search_path=public as $$
declare i jsonb; begin
  for i in select * from jsonb_array_elements(new.items) loop
    update products set stock=greatest(stock-(i->>'qty')::int,0) where id=(i->>'id')::uuid;
  end loop; return new; end $$;
drop trigger if exists trg_dec_stock on orders;
create trigger trg_dec_stock after insert on orders for each row execute function dec_stock();

-- Customer order tracking (needs order no + phone)
create or replace function track_order(p_no text,p_phone text) returns setof orders
language sql security definer set search_path=public as $$
  select * from orders where order_no=p_no and customer_phone=p_phone $$;
grant execute on function track_order(text,text) to anon,authenticated;

-- Row Level Security
alter table admins enable row level security;
alter table products enable row level security;
alter table banners enable row level security;
alter table division_shipping enable row level security;
alter table payment_settings enable row level security;
alter table orders enable row level security;

drop policy if exists "own admin row" on admins;
create policy "own admin row" on admins for select using(user_id=auth.uid());
drop policy if exists "public read" on products;   create policy "public read" on products for select using(true);
drop policy if exists "public read" on banners;    create policy "public read" on banners for select using(true);
drop policy if exists "public read" on division_shipping; create policy "public read" on division_shipping for select using(true);
drop policy if exists "public read" on payment_settings;  create policy "public read" on payment_settings for select using(true);
drop policy if exists "admin all" on products;   create policy "admin all" on products for all using(is_admin()) with check(is_admin());
drop policy if exists "admin all" on banners;    create policy "admin all" on banners for all using(is_admin()) with check(is_admin());
drop policy if exists "admin all" on division_shipping; create policy "admin all" on division_shipping for all using(is_admin()) with check(is_admin());
drop policy if exists "admin all" on payment_settings;  create policy "admin all" on payment_settings for all using(is_admin()) with check(is_admin());
drop policy if exists "customer place order" on orders;
create policy "customer place order" on orders for insert with check(order_status='Pending' and (user_id is null or user_id=auth.uid()));
drop policy if exists "customer read own" on orders;
create policy "customer read own" on orders for select using(user_id=auth.uid());
drop policy if exists "admin all" on orders; create policy "admin all" on orders for all using(is_admin()) with check(is_admin());

-- Image storage bucket
insert into storage.buckets(id,name,public) values('product-images','product-images',true) on conflict(id) do nothing;
drop policy if exists "img read" on storage.objects;
create policy "img read" on storage.objects for select using(bucket_id='product-images');
drop policy if exists "img admin write" on storage.objects;
create policy "img admin write" on storage.objects for all using(bucket_id='product-images' and is_admin()) with check(bucket_id='product-images' and is_admin());
